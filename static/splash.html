<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eaf4f8; background: #182440; font-family: "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none; }
    .logo { width: 82px; height: 82px; margin-bottom: 1rem; }
    .title { margin-bottom: .35rem; color: #ffb36b; font-size: 1.7rem; font-weight: 800; letter-spacing: .05em; }
    .subtitle { margin-bottom: 1.4rem; color: rgba(234,244,248,.65); font-size: .82rem; }
    .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.16); border-top-color: #29b6a5; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
    <img src="logo.svg" alt="Ludarium" class="logo">
    <div class="title">Ludarium</div>
    <div class="subtitle">Games and play sessions</div>
    <div class="spinner"></div>
</body>
</html>
